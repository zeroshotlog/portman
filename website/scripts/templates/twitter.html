<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 1200px;
      height: 600px;
      margin: 0;
      overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      position: relative;
    }

    .gradient-overlay {
      position: absolute;
      top: -150px;
      right: -150px;
      width: 700px;
      height: 700px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.3) 0%, transparent 70%);
      pointer-events: none;
    }

    .container {
      position: relative;
      width: 100%;
      height: 100%;
      padding: 70px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 50px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 24px;
    }

    .icon {
      width: 88px;
      height: 88px;
      border-radius: 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .title-group {
      flex: 1;
    }

    .app-name {
      font-size: 54px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 4px;
      letter-spacing: -0.03em;
    }

    .tagline {
      font-size: 30px;
      font-weight: 600;
      background: linear-gradient(90deg, #60a5fa 0%, #a78bfa 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .content {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .description {
      flex: 1;
      font-size: 26px;
      line-height: 1.5;
      color: #cbd5e1;
      max-width: 680px;
      font-weight: 400;
    }

    .badge-group {
      display: flex;
      flex-direction: column;
      gap: 16px;
      align-items: flex-end;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 12px 20px;
      background: rgba(59, 130, 246, 0.15);
      border: 1px solid rgba(59, 130, 246, 0.3);
      border-radius: 999px;
      color: #60a5fa;
      font-size: 18px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .pulse {
      width: 8px;
      height: 8px;
      background: #60a5fa;
      border-radius: 50%;
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.2); }
    }

    .platform-badge {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      color: #94a3b8;
      font-size: 17px;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="gradient-overlay"></div>
  <div class="container">
    <div class="header">
      <img src="{{ICON_URL}}" alt="Portman Icon" class="icon">
      <div class="title-group">
        <div class="app-name">Portman</div>
        <div class="tagline">Master Your Local Ports</div>
      </div>
    </div>

    <div class="content">
      <div class="description">
        macOS port management tool. Visualize TCP listeners, label services, and integrate with AI assistants via MCP.
      </div>

      <div class="badge-group">
        <div class="badge">
          <div class="pulse"></div>
          MCP Ready
        </div>
        <div class="platform-badge">macOS 11.0+</div>
      </div>
    </div>
  </div>
</body>
</html>
