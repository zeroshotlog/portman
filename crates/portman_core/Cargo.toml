[package]
name = "portman-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Core library for Portman, a macOS local port manager and visibility tool."
readme = "../../README.md"
keywords = ["port", "network", "macos", "development", "mcp"]
categories = ["command-line-utilities", "network-programming"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
regex = "1.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1.0"
