[package]
name = "portman-core"
version = "0.1.0"
edition = "2021"
description = "Core library for Portman, a local port manager."
license = "MIT"
repository = "https://github.com/your/portman"
authors = ["Your Name <your.email@example.com>"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.30", features = ["bundled"] }
thiserror = "1.0"
regex = "1.10"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }
log = "0.4"
anyhow = "1.0"
