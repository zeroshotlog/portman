[package]
name = "portman-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server for Portman, enabling Claude connection."
license = "MIT"
repository = "https://github.com/your/portman"
authors = ["Your Name <your.email@example.com>"]

[[bin]]
name = "portman-mcp"
path = "src/main.rs"

[dependencies]
portman-core = { path = "../portman_core", version = "0.1.0" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
