[package]
name = "portman-mcp"
version = "0.1.1"
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "MCP server for Portman, enabling AI agent integration for local port management."
readme = "../../README.crates-io.md"
keywords = ["mcp", "port", "macos", "ai", "claude"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "portman-mcp"
path = "src/main.rs"

[dependencies]
portman-core = { path = "../portman_core", version = "0.1.1" }
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
clap = { version = "4.4", features = ["derive"] }
chrono = "0.4"
